name: Trivy Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build container image
        run: docker build -t vaultcloud/api:latest ./app

      - name: Trivy image scan (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@57a97c75b7f2d0f7e903ea15c17e576423e66e56  # v0.35.0
        env:
          TRIVY_IGNOREFILE: ./app/.trivyignore
        with:
          image-ref: vaultcloud/api:latest
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Trivy filesystem scan (app dependencies)
        uses: aquasecurity/trivy-action@57a97c75b7f2d0f7e903ea15c17e576423e66e56  # v0.35.0
        env:
          TRIVY_IGNOREFILE: ./app/.trivyignore
        with:
          scan-type: fs
          scan-ref: ./app
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
