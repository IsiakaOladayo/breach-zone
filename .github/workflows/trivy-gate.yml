name: Trivy Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build container image
        run: docker build -t vaultcloud/api:${{ github.sha }} ./app

      - name: Trivy image scan (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: vaultcloud/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ./app/.trivyignore
          format: table
          version: v0.74.0

      - name: Trivy filesystem scan (app dependencies)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: fs
          scan-ref: ./app
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ./app/.trivyignore
          format: table
          version: v0.74.0
